v class="detail-item"><small>Dormitorios</small><strong>${p.rooms}</strong></div><div class="detail-item"><small>Baños</small><strong>${p.baths}</strong></div><div class="detail-item"><small>Estacionamientos</small><strong>${p.parking}</strong></div><div class="detail-item"><small>Ocupación informada</small><strong>${p.occupancy}</strong></div></div></section><section class="detail-info"><h2>Descripción</h2><p>${p.description}</p></section><section class="detail-info"><h2>Antecedentes y condiciones</h2><div class="account-card" style="margin:0"><div class="account-row"><span class="row-icon">${icon('clock')}</span><div><strong>Antecedentes legales</strong><small>En un inmueble real, aquí se indican archivos aprobados y fecha de revisión.</small></div><span class="chevron">›</span></div><div class="account-row"><span class="row-icon">${icon('clock')}</span><div><strong>Bases de la subasta</strong><small>Documento de demostración · ver condiciones antes de participar.</small></div><span class="chevron">›</span></div></div><p class="demo-disclaimer">Imágenes generadas para el prototipo. No representan ni acreditan una propiedad disponible.</p></section><div class="sticky-cta"><button class="btn btn-primary" onclick="startParticipate(${p.id})">Subastar en esta propiedad ${icon('arrow')}</button></div>${footer()}`}
function renderBlog(){return `<section class="subpage-head"><button class="back-button" onclick="go('home')">← Inicio</button><span class="eyebrow">Blog SeSubasta</span><h1>Información para revisar antes de decidir</h1><p>Artículos editoriales de muestra. El equipo editor podrá cargar noticias, texto e imágenes desde su panel.</p></section><section class="section" style="padding-top:10px"><div class="property-list">${posts.map(p=>`<article class="property-card"><div class="image-wrap"><img class="property-image" src="${photo(p.image)}" alt="Imagen ilustrativa" loading="lazy"><span class="photo-caption">Imagen ilustrativa</span></div><div class="property-body"><span class="eyebrow">${p.category}</span><h2 class="property-title" style="margin-top:8px">${p.title}</h2><p style="font-size:10px;color:var(--slate)">${p.lead}</p><div class="card-actions"><button class="btn btn-dark" onclick="go('article',posts.find(x=>x.id===${p.id}))">Leer artículo ${icon('arrow')}</button><span class="fact">${p.read}</span></div></div></article>`).join('')}</div></section>${footer()}`}
function renderArticle(p){return `<img class="article-cover" src="${photo(p.image)}" alt="Imagen ilustrativa"><article class="article-content"><button class="back-button" onclick="go('blog')">← Blog</button><div class="article-meta"><span>${p.category}</span><span>·</span><span>${p.read}</span><span>·</span><span>Contenido de demostración</span></div><h1>${p.title}</h1><p class="lead">${p.lead}</p><div class="article-callout">Esta es una vista editorial de muestra. Las publicaciones reales tendrán autor, fecha, imagen autorizada, título y descripción para buscadores.</div>${p.body.map((t,i)=>`<h2>${['Lee la ficha completa','Confirma qué está revisado','Pregunta antes de participar'][i]||'Revisa los antecedentes'}</h2><p>${t}</p>`).join('')}<h2>Preguntas frecuentes</h2><p><strong>¿Este artículo reemplaza una asesoría?</strong><br>No. La información es editorial y cada publicación debe ser revisada antes de publicarse.</p><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="go('catalog')">Explorar propiedades ${icon('arrow')}</button></article>${footer()}`}
function renderAccount(){if(!isLogged)return `<section class="account-hero"><span class="eyebrow" style="color:var(--lime)">Tu espacio SeSubasta</span><h1>Revisa tus subastas</h1><p>Ingresa para guardar propiedades y consultar tu actividad.</p></section><section class="auth-panel"><h2 style="font-size:15px;margin:8px 0">Accede a tu cuenta</h2><p>El recorrido de participación requiere una cuenta y la habilitación para cada subasta.</p><button class="btn btn-primary" onclick="loginReturn='account';go('login')">Iniciar sesión</button><button class="btn btn-outline" style="margin-top:9px" onclick="go('register')">Crear cuenta</button><div class="notice-box">La cuenta de demostración no se conecta a un servidor y no almacena documentos reales.</div></section>${footer()}`;return `<section class="account-hero"><span class="eyebrow" style="color:var(--lime)">Mi cuenta · demostración</span><h1>Hola, Alex</h1><p>Estado de cuenta: verificación de muestra · sin datos personales reales</p></section><div class="account-card"><button class="account-row" onclick="go('offers')"><span class="row-icon">${icon('clock')}</span><span><strong>Mis subastas</strong><small>Revisa actividad y resultados</small></span><span class="chevron">›</span></button><button class="account-row" onclick="go('saved')"><span class="row-icon">${icon('heart')}</span><span><strong>Propiedades guardadas</strong><small>${favorites.length} guardadas</small></span><span class="chevron">›</span></button><button class="account-row" onclick="go('profile')"><span class="row-icon">${icon('pin')}</span><span><strong>Perfil y privacidad</strong><small>Datos y preferencias</small></span><span class="chevron">›</span></button><button class="account-row" onclick="logoutDemo()"><span class="row-icon">↪</span><span><strong>Cerrar sesión</strong><small>Salir de la cuenta de demostración</small></span><span class="chevron">›</span></button></div>${footer()}`}
function renderOffers(){const rows=properties.filter(p=>p.condition==='En vivo').slice(0,2);return `<section class="subpage-head"><button class="back-button" onclick="go('account')">← Mi cuenta</button><span class="eyebrow">Actividad personal</span><h1>Mis subastas</h1><p>Solo tú ves tus montos e historial.</p></section><section class="section">${rows.map(p=>`<div class="staff-card" style="margin:0 0 10px"><h2>${p.title}</h2><p>${p.location} · En vivo · datos de demostración</p><div class="price-band"><div class="price-cell"><small>Tu mejor monto</small><strong>${money(p.currentUF)}</strong></div><div class="price-cell"><small>Estado</small><strong>Recibida</strong></div></div><button class="btn btn-outline" onclick="go('detail',properties.find(x=>x.id===${p.id}))">Ver ficha</button></div>`).join('')}<div class="notice-box">En producción, una oferta válida se registra en el servidor con hora y resultado de aceptación. Esta demo no envía datos.</div></section>${footer()}`}
function renderSaved(){const list=properties.filter(p=>favorites.includes(p.id));return `<section class="subpage-head"><button class="back-button" onclick="go('account')">← Mi cuenta</button><span class="eyebrow">Tu selección</span><h1>Propiedades guardadas</h1></section><section class="section">${list.length?`<div class="property-list">${list.map(propertyCard).join('')}</div>`:'<div class="empty-state">Aún no guardas propiedades. Puedes hacerlo desde el catálogo.</div>'}</section>${footer()}`}
function renderProfile(){return `<section class="subpage-head"><button class="back-button" onclick="go('account')">← Mi cuenta</button><span class="eyebrow">Datos y preferencias</span><h1>Perfil y privacidad</h1></section><section class="auth-panel"><div class="notice-box">Perfil de muestra. No ingreses un RUT, datos bancarios ni documentos reales en este prototipo.</div><label class="form-field"><span>Nombre</span><input value="Alex Demo"></label><label class="form-field"><span>Correo electrónico</span><input value="alex.demo@example.cl"></label><label class="form-field"><span>Preferencia de moneda</span><select onchange="setCurrency(this.value)"><option ${currency==='UF'?'selected':''}>UF</option><option ${currency==='CLP'?'selected':''}>CLP</option></select></label><button class="btn btn-primary" onclick="toast('Cambios de demostración guardados solo en esta vista.')">Guardar preferencias</button></section>${footer()}`}
function renderLogin(){const title=route==='register'?'Crea tu cuenta':'Inicia sesión';return `<section class="auth-panel"><button class="back-button" onclick="go(loginReturn==='participate'?'detail':'account',selectedProperty)">← Volver</button><span class="eyebrow">Cuenta de comprador</span><h1>${title}</h1><p>Una cuenta te permite guardar propiedades y solicitar habilitación para participar.</p>${route==='register'?'<label class="form-field"><span>Nombre y apellido</span><input placeholder="Nombre de muestra"></label>':''}<label class="form-field"><span>Correo electrónico</span><input type="email" placeholder="nombre@correo.cl"></label><label class="form-field"><span>Contraseña</span><input type="password" placeholder="Ingresa tu contraseña"></label><label class="form-check"><input type="checkbox"><span>Acepto los términos y la política de privacidad de demostración.</span></label><button class="btn btn-primary" onclick="loginDemo()">${route==='register'?'Crear cuenta de prueba':'Ingresar con cuenta de prueba'}</button><div class="demo-login"><strong>Modo demostración:</strong> este botón crea una sesión ficticia solo en tu navegador. No valida identidad ni habilita una participación real.</div><button class="text-link" style="margin-top:12px" onclick="go(route==='register'?'login':'register')">${route==='register'?'Ya tengo cuenta · ingresar':'Crear una cuenta'}</button></section>${footer()}`}

function renderAdminLogin(){showNav(false);demoBanner.classList.add('hidden');return `<section class="staff-wrap"><div class="staff-top"><div class="staff-wordmark">SESUBASTA · ACCESO INTERNO</div><h1>Acceso al equipo</h1><p>Ruta directa · acceso de demostración</p></div><section class="auth-panel"><div class="notice-box">Esta ruta no aparece en la navegación pública. La autenticación real debe conectarse al backend antes de producción.</div><label class="form-field"><span>Correo del equipo</span><input type="email" id="staffEmail" placeholder="nombre@sesubasta.cl"></label><label class="form-field"><span>Contraseña</span><input type="password" id="staffPassword" placeholder="Contraseña"></label><button class="btn btn-dark" onclick="enterStaff()">Ingresar al panel</button><div class="staff-demo"><strong>Acceso de prueba:</strong> elige un rol para recorrer su interfaz. No hay usuarios o contraseñas reales configurados en este prototipo.</div><div class="role-select">${[['colaborador','Colaborador'],['legal','Legal'],['admin','Administrador general'],['editor','Editor'],['operator','Operador']].map(([id,label])=>`<button class="role-option ${staffRole===id?'active':''}" onclick="staffRole='${id}';document.querySelectorAll('.role-option').forEach(x=>x.classList.remove('active'));this.classList.add('active')"><strong>${label}</strong><small>Vista móvil de muestra</small></button>`).join('')}</div><button class="text-link" onclick="go('home')">← Volver a la web pública</button></section></section>`}
function enterStaff(){go('staff')}
function staffTop(){const labels={colaborador:'Colaborador',legal:'Legal',admin:'Administrador general',editor:'Editor',operator:'Operador'};return `<div class="staff-top"><div class="staff-wordmark">SESUBASTA · PANEL INTERNO</div><h1>${labels[staffRole]}</h1><p>Sesión de demostración · acceso limitado por rol</p></div><button class="btn btn-outline staff-header-action" onclick="go('admin-login')">Cambiar rol de prueba</button>`}
function renderStaff(){showNav(false);demoBanner.classList.add('hidden');let content='';if(staffRole==='colaborador'){content=`<div class="staff-card"><h2>Mis tareas</h2><div class="staff-task"><span><strong>Casa luminosa con patio</strong><small>Borrador · 6 de 8 campos completos</small></span><span class="mini-tag pending">Borrador</span></div><button class="btn btn-primary" onclick="staffAction('Formulario de propiedad')">+ Ingresar propiedad</button></div><div class="staff-card"><h2>Permisos del rol</h2><p>Puedes crear y editar propiedades, cargar fotografías y solicitar revisión. No puedes cargar documentos legales ni publicar al catálogo.</p></div>`}else if(staffRole==='legal'){content=`<div class="staff-card"><h2>Propiedades pendientes de antecedentes</h2><div class="staff-task"><span><strong>Casa demostrativa · Ñuñoa</strong><small>Solicitud de revisión · hace 2 h</small></span><span class="mini-tag pending">Legal</span></div><label class="form-field"><span>Adjuntar documento legal (muestra)</span><input type="file" accept=".pdf,.doc,.docx,.jpg,.png" onchange="fileName(this)"></label><label class="form-field"><span>Nota de revisión</span><textarea placeholder="Indica antecedentes pendientes o revisados"></textarea></label><button class="btn btn-primary" onclick="staffAction('Antecedente registrado y remitido a revisión')">Guardar revisión legal</button></div><div class="staff-card"><h2>Tu alcance</h2><p>El rol Legal carga y revisa antecedentes. No aprueba ni publica la propiedad en el catálogo.</p></div>`}else if(staffRole==='admin'){content=`<div class="staff-card"><h2>Revisión final para publicar</h2><div class="staff-task"><span><strong>Casa demostrativa · Ñuñoa</strong><small>Colaborador y Legal completaron sus tareas</small></span><span class="mini-tag pending">Pendiente</span></div><p>Revisa los datos, las fotografías, el estado de revisión y la autorización de publicación.</p><label class="form-check"><input type="checkbox" id="adminChecklist"><span>Confirmo que revisé los datos públicos, las imágenes y los antecedentes autorizados.</span></label><button class="btn btn-primary" onclick="approveDemo()">Aprobar y publicar (muestra)</button><button class="btn btn-outline" onclick="staffAction('Se solicitaron cambios a colaborador y Legal')">Solicitar cambios</button></div><div class="staff-card"><h2>Panel de actividad</h2><div class="staff-task"><span><strong>Subastas en vivo</strong><small>2 fichas de demostración</small></span><span class="mini-tag approved">En curso</span></div><div class="staff-task"><span><strong>Artículos del blog</strong><small>1 borrador editorial</small></span><span class="mini-tag">Editor</span></div></div>`}else if(staffRole==='editor'){content=`<div class="staff-card"><h2>Crear noticia</h2><label class="form-field"><span>Título</span><input id="articleTitle" placeholder="Escribe un título claro para la noticia"></label><label class="form-field"><span>Texto</span><textarea id="articleText" placeholder="Redacta el contenido editorial"></textarea></label><label class="form-field"><span>Imagen de portada</span><input type="file" accept="image/*" onchange="fileName(this)"></label><label class="form-field"><span>Descripción para buscadores</span><input placeholder="Resumen breve de la noticia"></label><button class="btn btn-primary" onclick="staffAction('Artículo guardado como borrador')">Guardar borrador</button><button class="btn btn-dark" onclick="staffAction('Artículo programado para revisión editorial')">Solicitar revisión</button></div><div class="staff-card"><h2>Artículos recientes</h2><div class="staff-task"><span><strong>Antes de una subasta, revisa estas 5 partes de la ficha</strong><small>Publicado · muestra</small></span><span class="mini-tag approved">SEO</span></div></div>`}else{content=`<div class="staff-card"><h2>Monitor de subastas</h2><div class="staff-task"><span><strong>Departamento con terraza</strong><small>En vivo · 12 personas subastando · muestra</small></span><span class="mini-tag approved">Activa</span></div><div class="staff-task"><span><strong>Local comercial</strong><small>En vivo · 5 personas subastando · muestra</small></span><span class="mini-tag approved">Activa</span></div><button class="btn btn-dark" onclick="staffAction('Monitor de demostración abierto')">Abrir monitor</button><button class="btn btn-outline" onclick="staffAction('La suspensión requiere motivo y registro de auditoría')">Suspender con motivo</button></div>`}return `<div class="staff-wrap">${staffTop()}<div class="staff-demo">Prototipo local sin backend. Las acciones muestran el flujo y no publican propiedades ni guardan documentos reales.</div>${content}<button class="btn btn-outline staff-header-action" onclick="go('home')">Salir del panel de muestra</button></div>`}
function fileName(input){const f=input.files&&input.files[0];if(f)toast(`Archivo seleccionado: ${f.name}`)}function approveDemo(){if(!document.getElementById('adminChecklist')?.checked){toast('Confirma la revisión antes de aprobar.');return}staffAction('Propiedad aprobada y publicada solo en esta demostración.')}
function staffAction(text){toast(text)}
function footer(){return `<footer class="footer-note">SeSubasta.cl · Entender antes de decidir.<br>Prototipo local con datos, montos, fechas, participantes e imágenes ilustrativas.<br>Este código no se conecta a Cloudflare, no registra usuarios ni procesa pagos.</footer>`}
function render(){document.querySelectorAll('.currency-switch button').forEach(b=>b.classList.toggle('active',b.dataset.currency===currency));markNav();demoBanner.classList.toggle('hidden',['admin-login','staff'].includes(route));if(['admin-login','staff'].includes(route)){main.innerHTML=route==='admin-login'?renderAdminLogin():renderStaff();return}showNav(true);const views={home:renderHome,catalog:renderCatalog,detail:()=>renderDetail(selectedProperty),blog:renderBlog,article:()=>renderArticle(selectedPost),account:renderAccount,offers:renderOffers,saved:renderSaved,profile:renderProfile,login:renderLogin,register:renderLogin,participate:()=>renderParticipate(selectedProperty)};main.innerHTML=(views[route]||renderHome)();window.scrollTo({top:0,behavior:'smooth'})}
function setCurrency(value){currency=value;storage.set('ss-currency',value);render()}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];storage.set('ss-favorites',JSON.stringify(favorites));render();toast(favorites.includes(id)?'Propiedad guardada.':'Propiedad quitada de guardadas.')}
function loginDemo(){isLogged=true;storage.set('ss-demo-user','1');go(loginReturn==='participate'?'participate':'account',selectedProperty)}
function logoutDemo(){isLogged=false;storage.remove('ss-demo-user');go('account')}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
document.querySelectorAll('.currency-switch button').forEach(b=>b.addEventListener('click',()=>setCurrency(b.dataset.currency)));
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));
window.addEventListener('hashchange',()=>{parseRoute();render()});
parseRoute();

/* Desktop extension. Demo data stays in this browser. */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demoUsers={ 'admin@demo.cl':'admin','legal@demo.cl':'legal','colaborador@demo.cl':'colaborador','editor@demo.cl':'editor','operador@demo.cl':'operator'};
let internal=storage.get('ss-desktop-staff',''),workTab='overview';
let drafts=JSON.parse(storage.get('ss-desktop-drafts','[]')),legalFiles=JSON.parse(storage.get('ss-desktop-legal','[]')),enrollments=JSON.parse(storage.get('ss-desktop-enrolled','[]')),bidHistory=JSON.parse(storage.get('ss-desktop-bids','[]'));
let extraPosts=JSON.parse(storage.get('ss-desktop-posts','[]'));posts.push(...extraPosts);
const roleLabels={admin:'Administrador general',legal:'Legal',colaborador:'Colaborador',editor:'Editor',operator:'Operador'};
function persist(){storage.set('ss-desktop-drafts',JSON.stringify(drafts));storage.set('ss-desktop-legal',JSON.stringify(legalFiles));storage.set('ss-desktop-enrolled',JSON.stringify(enrollments));storage.set('ss-desktop-bids',JSON.stringify(bidHistory))}
const originalRender=render,originalHome=renderHome,originalDetail=renderDetail,originalCatalog=renderCatalog;
render=function(){const h=location.hash.slice(1);if(h.startsWith('screen/')){main.innerHTML=renderScreen(h.slice(7));showNav(false);return}if(h==='design-index'){main.innerHTML=screenIndex();return}if(route==='staff'){main.innerHTML=internal?renderWorkspace():renderAdminLogin();showNav(false);return}originalRender();if(route==='catalog'){const sec=main.querySelector('.catalog-section');if(sec){sec.outerHTML=`<div class="catalog-layout"><aside class="filter-panel"><h3>Filtra tu búsqueda</h3><label class="form-field"><span>Tipo de propiedad</span><select onchange="setFilter(this.value)">${['Todas','Casas','Departamentos','Oficinas','Locales'].map(x=>`<option ${x===currentFilter?'selected':''}>${x}</option>`).join('')}</select></label><label class="form-field"><span>Estado</span><select onchange="filterStatus=this.value;render()"><option value="">Todos</option><option ${filterStatus==='En vivo'?'selected':''}>En vivo</option><option ${filterStatus==='Próxima'?'selected':''}>Próxima</option></select></label><label class="form-field"><span>Máximo UF</span><input type="number" min="0" value="${maxUF||''}" onchange="maxUF=Number(this.value);render()"></label><button class="btn btn-outline" onclick="currentFilter='Todas';searchTerm='';filterStatus='';maxUF=0;render()">Limpiar filtros</button><p class="demo-disclaimer">UF referencial de muestra: $40.000. No es una cotización vigente.</p></aside>${sec.outerHTML}</div>`}}if(route==='detail')desktopDetail();if(route==='participate')main.querySelector('h1').textContent='Confirma tu monto para subastar';};
let filterStatus='',maxUF=0;const oldMatches=matches;matches=p=>oldMatches(p)&&(!filterStatus||p.condition===filterStatus)&&(!maxUF||p.minUF<=maxUF);
setFilter=function(x){currentFilter=x;render()};
function desktopDetail(){const p=selectedProperty,old=main.innerHTML;const box=document.createElement('div');box.innerHTML=old;const hero=box.querySelector('.detail-hero');hero.querySelector('.gallery-count').textContent='Imagen ilustrativa';const summary=box.querySelector('.detail-summary'),infos=[...box.querySelectorAll('.detail-info')];main.innerHTML=`<div class="detail-layout"><div>${hero.outerHTML}${summary.outerHTML}${infos.map(x=>x.outerHTML).join('')}</div><aside class="detail-side"><span class="status-pill">${p.condition}</span><h2>${money(p.currentUF)}</h2><p>Monto vigente · demostración</p><div class="schedule-card"><div class="schedule-line"><span>Inicio</span><strong>${dateTime(p.start)}</strong></div><div class="schedule-line"><span>Cierre</span><strong>${dateTime(p.end)}</strong></div><div class="schedule-line"><span>Participantes únicos</span><strong>${p.people} · muestra</strong></div></div><p>Unidad contractual de muestra: UF.<br>Siguiente mínimo: <strong>${money(p.currentUF+50)}</strong></p><button class="btn btn-primary" onclick="startParticipate(${p.id})">${p.condition==='En vivo'?'Subastar':'Inscribirme'}</button><button class="btn btn-outline" onclick="toggleFavorite(${p.id})">${favorites.includes(p.id)?'Quitar de guardadas':'Guardar propiedad'}</button><p class="demo-disclaimer">UF referencial fija: $40.000. Los requisitos, garantías y reglas definitivas deben ser aprobados antes del lanzamiento.</p></aside></div>${footer()}`}
renderAdminLogin=function(){return `<section class="auth-panel"><span class="eyebrow">Acceso al equipo</span><h1>Bienvenido de vuelta</h1><p>Ingresa con tu cuenta interna.</p><form onsubmit="event.preventDefault();enterStaff()"><label class="form-field"><span>Correo del equipo</span><input id="staffEmail" type="email" required autocomplete="username"></label><label class="form-field"><span>Contraseña</span><input id="staffPassword" type="password" required autocomplete="current-password"></label><button class="btn btn-primary">Ingresar</button></form><p class="demo-disclaimer">Entorno local de demostración. Credenciales de prueba en LEEME.md.</p></section>`};
enterStaff=function(){const email=document.getElementById('staffEmail').value.trim().toLowerCase();if(!demoUsers[email]||document.getElementById('staffPassword').value!=='Demo2026!'){toast('Revisa el correo y la contraseña de prueba.');return}internal=demoUsers[email];staffRole=internal;storage.set('ss-desktop-staff',internal);go('staff')};
function staffExit(){internal='';storage.remove('ss-desktop-staff');go('admin-login')}
function tab(t){workTab=t;go('staff')}
function renderWorkspace(){const allowed={admin:['overview','properties','reviews','users','settings','blog','operations'],colaborador:['overview','properties'],legal:['overview','legal'],editor:['overview','blog'],operator:['overview','operations']}[internal];if(!allowed.includes(workTab))workTab='overview';const labels={overview:'Resumen',properties:'Propiedades',reviews:'Revisión final',users:'Usuarios y roles',settings:'Configuración',blog:'Blog editorial',legal:'Expedientes legales',operations:'Operación de subastas'};return `<div class="workspace"><aside><small>${roleLabels[internal]}</small>${allowed.map(t=>`<a href="#staff" onclick="tab('${t}')">${labels[t]}</a>`).join('')}<a href="#admin-login" onclick="staffExit()">Cerrar sesión</a></aside><section class="work-main"><span class="eyebrow">Equipo SeSubasta · entorno local</span><h1>${labels[workTab]}</h1><p>Las acciones se guardan en este navegador. No uses información personal ni documentos reales.</p>${workContent()}</section></div>`}
function field(label,id,type='text',value=''){return `<label class="form-field"><span>${label}</span><input id="${id}" type="${type}" value="${esc(value)}" required></label>`}
function draftTable(){return `<div class="panel"><h2>Propiedades del equipo</h2><table><thead><tr><th>Propiedad</th><th>Estado</th><th>Legal</th><th>Acción</th></tr></thead><tbody>${drafts.map(d=>`<tr><td>${esc(d.title)}<br><small>${esc(d.location)}</small></td><td><span class="badge">${d.status}</span></td><td>${legalFiles.some(f=>f.id===d.id)?'Antecedentes cargados':'Pendiente'}</td><td>${internal==='colaborador'?`<button class="text-link" onclick="reviewDraft(${d.id})">Solicitar revisión</button>`:internal==='admin'?`<button class="text-link" onclick="approveDraft(${d.id})">Aprobar y publicar</button><br><button class="text-link" onclick="requestChanges(${d.id})">Solicitar cambios</button>`:'Solo lectura'}</td></tr>`).join('')||'<tr><td colspan="4">Aún no se han ingresado propiedades. El colaborador puede crear la primera.</td></tr>'}</tbody></table></div>`}

class AuctionError extends Error{constructor(code,message,status=409){super(message);this.code=code;this.status=status}}
function minorAmount(text){const s=String(text).trim().replace(',','.');if(!/^\d{1,10}(\.\d{1,2})?$/.test(s))throw new AuctionError('AMOUNT_INVALID','Ingresa un monto positivo con hasta dos decimales.',422);const [a,b='']=s.split('.');const n=Number(a)*100+Number((b+'00').slice(0,2));if(!Number.isSafeInteger(n)||n<=0)throw new AuctionError('AMOUNT_INVALID','El monto no es válido.',422);return n}
function seed(rows,at=Date.now()){return {schema:2,auctions:Object.fromEntries(rows.map((p,i)=>{const active=p.condition==='En vivo';const start=active?at-60000:at+(i+1)*3600000;const end=active?at+(p.id===2?15:30)*60000:start+86400000;return [String(p.id),{id:p.id,start,end,status:'scheduled',initialMinor:Math.round(p.minUF*100),currentMinor:Math.round(p.minUF*100),incrementMinor:5000,unit:'UF',termsVersion:'demo-2026-10-v4',version:0,sequence:0,bids:[],keys:{}}]}))}}
class Engine{
 constructor(state,{clock=()=>Date.now(),persist=()=>{}}={}){this.state=state;this.clock=clock;this.persist=persist}
 status(a){const now=this.clock();if(['paused','cancelled'].includes(a.status))return a.status;if(now>=a.end)return 'closed';if(now<a.start)return 'scheduled';return 'open'}
 snapshot(id){const a=this.state.auctions[String(id)];if(!a)throw new AuctionError('NOT_FOUND','La subasta no existe.',404);const count=new Set(a.bids.map(b=>b.buyer)).size;return {id:a.id,start:a.start,end:a.end,status:this.status(a),currentMinor:a.currentMinor,initialMinor:a.initialMinor,incrementMinor:a.incrementMinor,nextMinor:a.bids.length?a.currentMinor+a.incrementMinor:a.initialMinor,unit:a.unit,termsVersion:a.termsVersion,version:a.version,sequence:a.sequence,participants:count,totalBids:a.bids.length,serverNow:this.clock()}}
 snapshots(){return Object.keys(this.state.auctions).map(id=>this.snapshot(id))}
 own(buyer,id){const rows=id?[this.state.auctions[String(id)]].filter(Boolean):Object.values(this.state.auctions);return rows.flatMap(a=>a.bids.filter(b=>b.buyer===buyer).map(b=>({id:a.id,receipt:b.receipt,amountMinor:b.amountMinor,time:b.time,sequence:b.sequence,leading:a.bids.at(-1)?.buyer===buyer&&b.receipt===a.bids.at(-1)?.receipt}))).sort((a,b)=>b.time-a.time)}
 submit({id,buyer,amountMinor,unit,termsVersion,key,expectedVersion}){
  const a=this.state.auctions[String(id)];if(!a)throw new AuctionError('NOT_FOUND','La subasta no existe.',404);
  if(!buyer)throw new AuctionError('AUTH_REQUIRED','Inicia sesión para subastar.',401);
  if(typeof key!=='string'||!/^[a-zA-Z0-9_-]{8,100}$/.test(key))throw new AuctionError('KEY_INVALID','La solicitud necesita una referencia válida.',422);
  const sk=buyer+':'+key,existing=a.keys[sk];
  if(existing){if(existing.amountMinor!==amountMinor||existing.unit!==unit||existing.termsVersion!==termsVersion)throw new AuctionError('KEY_REUSED','La referencia ya se utilizó con otro monto.');return {receipt:{...existing},snapshot:this.snapshot(id),duplicate:true}}
  if(this.status(a)!=='open')throw new AuctionError('AUCTION_NOT_OPEN','La subasta no está abierta.');
  if(termsVersion!==a.termsVersion)throw new AuctionError('TERMS_CHANGED','Las condiciones cambiaron. Revísalas nuevamente.');
  if(unit!==a.unit||!Number.isSafeInteger(amountMinor)||amountMinor<=0||amountMinor>999999999999)throw new AuctionError('AMOUNT_INVALID','Revisa el monto y la unidad.',422);
  if(!Number.isInteger(expectedVersion)||expectedVersion!==a.version)throw new AuctionError('AUCTION_CHANGED','Hay una actualización. Revisa el nuevo mínimo y confirma nuevamente.');
  const next=a.bids.length?a.currentMinor+a.incrementMinor:a.initialMinor;
  if(amountMinor<next)throw new AuctionError('AMOUNT_TOO_LOW','El monto es menor al mínimo vigente.',422);
  const newState=JSON.parse(JSON.stringify(this.state)),n=newState.auctions[String(id)];
  const receipt={id:n.id,buyer,amountMinor,unit,termsVersion,receipt:'SS-DEMO-'+id+'-'+(n.sequence+1),time:this.clock(),sequence:n.sequence+1};
  n.currentMinor=amountMinor;n.version++;n.sequence++;n.bids.push(receipt);n.keys[sk]=receipt;
  // Commit before acknowledging or broadcasting. A failed persistence leaves state intact.
  this.persist(newState);this.state=newState;
  return {receipt:{...receipt},snapshot:this.snapshot(id),duplicate:false}
 }
}
return {Engine,seed,minorAmount,AuctionError};});
</script>
<script>/* Continuous live participation. Browser-only preview and optional shared local server. */
const rt={mode:'individual',ready:false,connected:true,lastSeen:0,serverAt:0,monotonic:0,auctions:new Map(),mine:[],review:null,pending:null,sending:false,receipt:null,user:null,token:'',source:null};
let individualState;try{individualState=JSON.parse(sessionStorage.getItem('ss-live-individual-state')||'null')}catch{}if(!individualState||individualState.schema!==2)individualState=AuctionCore.seed(properties);const saveIndividual=state=>{try{sessionStorage.setItem('ss-live-individual-state',JSON.stringify(state))}catch{}};saveIndividual(individualState);const offlineEngine=new AuctionCore.Engine(individualState,{persist:saveIndividual});
try{rt.user=JSON.parse(sessionStorage.getItem('ss-live-user')||'null');rt.token=sessionStorage.getItem('ss-live-token')||'';rt.pending=JSON.parse(sessionStorage.getItem('ss-live-pending')||'null');if(rt.pending)rt.review={...rt.pending}}catch{}
isLogged=!!rt.user;parseRoute();
const labelsLive={open:'En vivo',scheduled:'Próxima',closed:'Cerrada',paused:'Suspendida',cancelled:'Cancelada'};
function liveNow(){return rt.serverAt?rt.serverAt+(performance.now()-rt.monotonic):Date.now()}
function currentAuction(id){return rt.auctions.get(Number(id))}
function actualStatus(a){if(!a)return 'unavailable';if(['paused','cancelled'].includes(a.status))return a.status;if(liveNow()>=a.end)return 'closed';if(liveNow()<a.start)return 'scheduled';return a.status==='closed'?'closed':'open'}
function countdown(a){if(!a)return 'Sin datos de la subasta';const status=actualStatus(a);if(status==='closed')return 'Finalizada';if(status==='paused')return 'Subasta suspendida';if(status==='cancelled')return 'Subasta cancelada';const ms=Math.max(0,(status==='scheduled'?a.start:a.end)-liveNow()),s=Math.ceil(ms/1000);const days=Math.floor(s/86400),h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60,sec=s%60;return (status==='scheduled'?'Empieza en ':'Cierra en ')+(days?days+' d ':'')+[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')}
money=function(uf){return currency==='UF'?Number(uf).toLocaleString('es-CL',{maximumFractionDigits:2})+' UF':'$'+Math.round(uf*UF_DEMO_CLP).toLocaleString('es-CL')};
function acceptSnapshots(data){rt.serverAt=data.serverNow||Date.now();rt.monotonic=performance.now();rt.lastSeen=performance.now();rt.connected=true;let changed=false;for(const a of data.auctions){const old=rt.auctions.get(a.id);if(!old||old.version!==a.version||old.status!==a.status)changed=true;rt.auctions.set(a.id,a);const p=properties.find(p=>p.id===a.id);if(p){p.start=a.start;p.end=a.end;p.currentUF=a.currentMinor/100;p.people=a.participants;p.condition=labelsLive[actualStatus(a)]||'No disponible'}}patchLive();if(changed&&rt.mode==='server'&&rt.user)loadMine().then(patchLive)}
function connectionLabel(){if(rt.mode==='individual')return 'Vista individual · sin sincronización entre personas';if(!rt.connected||performance.now()-rt.lastSeen>5000)return 'Reconectando · nuevos envíos bloqueados';return 'Conectado al servidor local · actualización en tiempo real'}
function liveAmount(a,kind){return a?money(a[kind]/100):'—'}
function ownSummary(id){const own=rt.mine.filter(x=>x.id===id);if(!own.length)return 'Todavía no has subastado en esta propiedad.';return own.some(x=>x.leading)?'Tu monto está primero por ahora.':'Otro monto supera tu mejor registro.'}
function livePanel(p,form=false){const a=currentAuction(p.id),status=actualStatus(a);return `<section class="live-auction" data-live-id="${p.id}"><div class="live-status"><span class="status-pill" data-live="status">${labelsLive[status]||'Cargando'}</span><small data-live="connection">${connectionLabel()}</small></div><p data-live="countdown" class="live-countdown">${countdown(a)}</p><small>${a?.totalBids?'Monto vigente':'Monto inicial'} · demostración</small><h2 data-live="current">${liveAmount(a,'currentMinor')}</h2><div class="live-next"><small>Siguiente mínimo permitido</small><strong data-live="next">${liveAmount(a,'nextMinor')}</strong></div><div class="schedule-card"><div class="schedule-line"><span>Inicio · hora de Chile</span><strong>${a?dateTime(a.start):'—'}</strong></div><div class="schedule-line"><span>Cierre · hora de Chile</span><strong>${a?dateTime(a.end):'—'}</strong></div><div class="schedule-line"><span>Personas que han subastado</span><strong data-live="people">${a?.participants||0}</strong></div><div class="schedule-line"><span>Registros aceptados</span><strong data-live="bids">${a?.totalBids||0}</strong></div></div><p data-live="own" class="live-own">${rt.user?ownSummary(p.id):'Inicia sesión para subastar directamente.'}</p>${!form?`<button class="btn btn-primary" data-live="action" onclick="startParticipate(${p.id})" ${status!=='open'?'disabled':''}>${status==='open'?'Subastar':status==='scheduled'?'Aún no comienza':'Subasta no disponible'}</button>`:''}<p class="currency-note">Montos de prueba. Unidad contractual: UF. Equivalencia fija de muestra: $40.000 por UF, sin vigencia oficial.</p><p class="demo-disclaimer">${rt.mode==='server'?'Dos sesiones conectadas a este servidor comparten el mismo estado.':'Para probar dos personas en tiempo real, inicia el servidor local incluido.'} No hay inscripción por propiedad.</p></section>`}
const inheritedCard=propertyCard;
propertyCard=function(p){const a=currentAuction(p.id),status=actualStatus(a);return `<article class="property-card" data-live-id="${p.id}"><div class="image-wrap"><img class="property-image" src="${photo(p.image)}" alt="Imagen ilustrativa de ${esc(p.type)}" loading="lazy" width="640" height="426"><div class="image-top"><span class="status-pill" data-live="status">${labelsLive[status]||'Cargando'}</span></div><button class="save-btn ${favorites.includes(p.id)?'saved':''}" aria-label="Guardar propiedad" onclick="toggleFavorite(${p.id})">${icon('heart')}</button><span class="photo-caption">Imagen ilustrativa</span></div><div class="property-body"><h3 class="property-title">${esc(p.title)}</h3><div class="location">${icon('pin')} ${esc(p.location)}</div><div class="facts"><span class="fact">${p.area} m² útiles</span>${p.plot?`<span class="fact">${p.plot} m² terreno</span>`:''}<span class="fact">${p.rooms} dorm.</span><span class="fact">${p.baths} baños</span><span class="fact">${esc(p.occupancy)}</span></div><div class="price-band"><div class="price-cell"><small>Monto vigente / inicial · muestra</small><strong data-live="current">${liveAmount(a,'currentMinor')}</strong></div><div class="price-cell"><small>Siguiente mínimo</small><strong data-live="next">${liveAmount(a,'nextMinor')}</strong></div></div><div class="auction-times"><div class="time-cell"><small>Inicio · Chile</small><strong>${a?dateTime(a.start):dateTime(p.start)}</strong></div><div class="time-cell"><small>Cierre · Chile</small><strong>${a?dateTime(a.end):dateTime(p.end)}</strong></div></div><p class="card-countdown" data-live="countdown">${countdown(a)}</p><p class="participants"><strong data-live="people">${a?.participants||0}</strong>&nbsp; personas han subastado · prueba</p><div class="card-actions"><button class="btn btn-dark" onclick="go('detail',properties.find(x=>x.id===${p.id}))">Ver ficha completa</button><button class="btn btn-primary" data-live="action" onclick="startParticipate(${p.id})" ${status!=='open'?'disabled':''}>${status==='open'?'Subastar':'Ver fechas'}</button></div></div></article>`};
startParticipate=function(id){const p=properties.find(x=>x.id===Number(id));if(!p)return;if(rt.pending&&rt.pending.id!==p.id)return toast('Primero resuelve el envío pendiente en su subasta.');selectedProperty=p;const a=currentAuction(id);if(actualStatus(a)!=='open'){go('detail',p);return toast('Revisa la fecha y el estado de esta subasta.')}loginReturn='participate';if(!rt.user){go('login');return}rt.review=null;go('participate',p)};
renderLogin=function(){return `<section class="auth-panel"><span class="eyebrow">Cuenta de comprador · prueba</span><h1>Inicia sesión para subastar</h1><p>Una sola cuenta te permite subastar en las propiedades activas, sin inscribirte en cada remate.</p><p>Elige una de estas cuentas ficticias para probar el prototipo. Cada pestaña conserva su propia sesión.</p><div class="demo-buyers"><button class="btn btn-primary" onclick="loginDemo('alex')">Entrar como Alex · prueba</button><button class="btn btn-outline" onclick="loginDemo('camila')">Entrar como Camila · prueba</button></div><p class="demo-disclaimer">Estas cuentas no verifican identidad ni sustituyen el registro seguro de producción.</p></section>`};
loginDemo=async function(profile='alex'){try{if(rt.pending?.buyerProfile&&profile!==rt.pending.buyerProfile)return toast('La solicitud pendiente corresponde a otra cuenta de prueba.');if(rt.mode==='server'){const data=await api('/api/demo-session',{method:'POST',body:JSON.stringify({profile})});rt.token=data.token;rt.user=data.user}else{rt.user={id:profile,name:profile==='alex'?'Alex Demo':'Camila Demo'};rt.token=''}sessionStorage.setItem('ss-live-user',JSON.stringify(rt.user));sessionStorage.setItem('ss-live-token',rt.token);isLogged=true;await loadMine();if(loginReturn==='participate')startParticipate(selectedProperty.id);else go('account')}catch{toast('No se pudo iniciar la sesión de prueba. Revisa la conexión.')}};
logoutDemo=function(){rt.user=null;rt.token='';rt.mine=[];isLogged=false;sessionStorage.removeItem('ss-live-user');sessionStorage.removeItem('ss-live-token');go('account')};
const oldAccountLive=renderAccount;renderAccount=function(){return oldAccountLive().replace('Hola, Alex','Hola, '+esc(rt.user?.name||'comprador')).replace('verificación de muestra','sesión ficticia')};
renderOffers=function(){return `<section class="generic"><span class="eyebrow">Mi cuenta</span><h1>Mis subastas</h1><p>${rt.user?esc(rt.user.name):'Inicia sesión para consultar tu actividad.'}</p><div class="panel"><table><thead><tr><th>Propiedad</th><th>Tu monto</th><th>Fecha · Chile</th><th>Estado actual</th><th>Referencia</th></tr></thead><tbody>${rt.mine.map(b=>`<tr><td>${esc(properties.find(p=>p.id===b.id)?.title||b.id)}</td><td>${money(b.amountMinor/100)}</td><td>${dateTime(b.time)}</td><td>${b.leading?'Primero por ahora':'Registro anterior'}</td><td>${b.receipt}</td></tr>`).join('')||'<tr><td colspan="5">Todavía no has subastado. Explora las propiedades activas.</td></tr>'}</tbody></table><button class="btn btn-dark" onclick="go('catalog')">Explorar propiedades</button></div></section>`};
renderParticipate=function(p){const a=currentAuction(p.id),status=actualStatus(a);return `<section class="live-room"><div class="room-header"><a class="text-link" href="#property/${p.id}">← Volver a la ficha</a><span class="eyebrow">Subasta en vivo · demostración</span><h1>${esc(p.title)}</h1><p>${esc(p.location)}</p></div><div class="room-layout"><div><img class="room-photo" src="${photo(p.image)}" alt="Fotografía ilustrativa de la propiedad"><div class="panel"><h2>Puedes seguir subastando hasta el cierre</h2><p>Cada monto aceptado actualiza el estado para las personas conectadas. Si otro registro cambia el mínimo mientras confirmas, tendrás que revisar el nuevo monto.</p><p>Incremento mínimo de muestra: ${money((a?.incrementMinor||5000)/100)}. El cierre de esta demo es fijo, sin extensiones automáticas.</p><p>No hay inscripción por propiedad, garantía ni aprobación manual de cada registro.</p></div></div><div class="panel live-entry">${livePanel(p,true)}<div id="bidFlow">${bidFlow(p,a,status)}</div></div></div></section>`};
function bidFlow(p,a,status){if(!rt.user)return '<button class="btn btn-primary" onclick="go(\'login\')">Iniciar sesión</button>';if(rt.review){const b=rt.review;return `<div class="bid-review"><h2>Revisa tu monto</h2><p class="review-amount">${money(b.amountMinor/100)}</p><p>Unidad contractual: UF · Cierre: ${dateTime(a.end)} (Chile).</p><p>No se enviará hasta que confirmes. Si cambia el estado o el mínimo, tendrás que volver a revisar.</p><p id="liveBidError" class="form-error" role="alert"></p><div class="step-buttons"><button class="btn btn-outline" onclick="editLiveBid()" ${rt.sending?'disabled':''}>Editar</button><button class="btn btn-primary" id="confirmLiveBid" onclick="sendLiveBid()" ${rt.sending?'disabled':''}>${rt.pending?'Reintentar la misma solicitud':'Confirmar y subastar'}</button></div></div>`}return `<form onsubmit="event.preventDefault();reviewLiveBid(${p.id})"><label class="form-field"><span>Tu monto en UF</span><input id="liveAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="${a?a.nextMinor/100:''}" value="${a?a.nextMinor/100:''}" required aria-describedby="nextAmountHelp"></label><p id="nextAmountHelp">Mínimo vigente: <strong data-live="next">${liveAmount(a,'nextMinor')}</strong></p><label class="form-check"><input type="checkbox" id="liveTerms" required> Revisé las condiciones de demostración, versión ${a?.termsVersion||'—'}.</label><p id="liveBidError" class="form-error" role="alert"></p><div class="step-buttons"><button class="btn btn-primary" data-live="review-action" ${status!=='open'?'disabled':''}>Revisar monto para subastar</button></div></form>${rt.receipt?.id===p.id?`<div class="live-receipt" role="status"><strong>Monto aceptado · ${money(rt.receipt.amountMinor/100)}</strong><p>${rt.receipt.receipt} · ${dateTime(rt.receipt.time)}</p><p>Puedes volver a subastar mientras la subasta siga abierta.</p><button class="text-link" onclick="go('offers')">Ver mi historial</button></div>`:''}`}
function reviewLiveBid(id){try{if(rt.mode==='server'&&(!rt.connected||performance.now()-rt.lastSeen>5000))throw Error('Espera a que se restablezca la conexión.');const a=currentAuction(id);if(!rt.user||actualStatus(a)!=='open')throw Error('La cuenta o subasta no está disponible.');const amount=AuctionCore.minorAmount(document.getElementById('liveAmount').value);if(amount<a.nextMinor)throw Error('El monto debe ser al menos '+liveAmount(a,'nextMinor')+'.');if(!document.getElementById('liveTerms').checked)throw Error('Revisa y acepta las condiciones de demostración.');rt.review={id,amountMinor:amount,unit:a.unit,termsVersion:a.termsVersion,expectedVersion:a.version,key:'bid_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2))};rt.pending=null;render()}catch(e){document.getElementById('liveBidError').textContent=e.message}}
function editLiveBid(){if(rt.pending)return toast('Primero consulta el resultado de la solicitud pendiente con el mismo reintento.');rt.review=null;render()}
async function api(url,options={}){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),10000);try{const r=await fetch(url,{...options,signal:abort.signal,headers:{'Content-Type':'application/json',...(rt.token?{Authorization:'Bearer '+rt.token}:{}),...options.headers}});let d;try{d=await r.json()}catch{throw Error('Respuesta no disponible.')}if(!r.ok){const e=new Error(d.message||'No se completó la operación.');e.code=d.code;e.status=r.status;throw e}return d}finally{clearTimeout(timer)}}
async function sendLiveBid(){if(rt.sending||!rt.review)return;rt.sending=true;const request=rt.pending||{...rt.review,buyerProfile:rt.user.id};rt.pending=request;sessionStorage.setItem('ss-live-pending',JSON.stringify(request));const button=document.getElementById('confirmLiveBid');if(button){button.disabled=true;button.textContent='Confirmando…'}try{let result;if(rt.mode==='server')result=await api('/api/auctions/'+request.id+'/bids',{method:'POST',body:JSON.stringify(request)});else result=offlineEngine.submit({...request,buyer:rt.user.id});rt.receipt=result.receipt;rt.review=null;rt.pending=null;sessionStorage.removeItem('ss-live-pending');uiDrafts.delete(location.hash+'|liveAmount');uiDrafts.delete(location.hash+'|liveTerms');acceptSnapshots({auctions:[result.snapshot],serverNow:result.snapshot.serverNow});await loadMine();render();toast('Monto aceptado. Puedes seguir subastando hasta el cierre.')}catch(e){if(e.status){rt.pending=null;rt.review=null;sessionStorage.removeItem('ss-live-pending');await refreshSnapshots();render();const error=document.getElementById('liveBidError');if(error)error.textContent=e.message;toast(e.message)}else{const error=document.getElementById('liveBidError');if(error)error.textContent='Resultado pendiente de confirmar. Reintenta la misma solicitud; no se generará un segundo registro.';if(button){button.disabled=false;button.textContent='Reintentar la misma solicitud'}}}finally{rt.sending=false;if(button&&document.contains(button)&&!rt.pending)button.disabled=false}}
async function loadMine(){if(!rt.user){rt.mine=[];return}if(rt.mode==='server'){try{rt.mine=(await api('/api/my-bids')).bids}catch(e){if(e.status===401){rt.user=null;isLogged=false;rt.mine=[]}}}else rt.mine=offlineEngine.own(rt.user.id)}
async function refreshSnapshots(){try{if(rt.mode==='server')acceptSnapshots(await api('/api/auctions'));else acceptSnapshots({auctions:offlineEngine.snapshots(),serverNow:Date.now()})}catch{rt.connected=false;patchLive()}}
function patchLive(){document.querySelectorAll('[data-live-id]').forEach(block=>{const id=Number(block.dataset.liveId),a=currentAuction(id);if(!a)return;const status=actualStatus(a),text={status:labelsLive[status],current:liveAmount(a,'currentMinor'),next:liveAmount(a,'nextMinor'),people:String(a.participants),bids:String(a.totalBids),countdown:countdown(a),connection:connectionLabel(),own:rt.user?ownSummary(id):'Inicia sesión para subastar directamente.'};for(const [kind,value]of Object.entries(text))block.querySelectorAll('[data-live="'+kind+'"]').forEach(el=>el.textContent=value);block.querySelectorAll('[data-live="action"]').forEach(b=>{b.disabled=status!=='open';b.textContent=status==='open'?'Subastar':status==='scheduled'?'Aún no comienza':labelsLive[status]||'No disponible'});block.querySelectorAll('[data-live="review-action"]').forEach(b=>b.disabled=status!=='open'||(rt.mode==='server'&&(!rt.connected||performance.now()-rt.lastSeen>5000)))});const active=currentAuction(selectedProperty?.id);if(active){document.querySelectorAll('#nextAmountHelp [data-live="next"]').forEach(el=>el.textContent=liveAmount(active,'nextMinor'));document.querySelectorAll('[data-live="review-action"]').forEach(b=>b.disabled=actualStatus(active)!=='open'||(rt.mode==='server'&&!rt.connected))}const sticky=document.getElementById('stickySubastar');if(sticky&&active){sticky.querySelector('strong').textContent=liveAmount(active,'currentMinor');const b=sticky.querySelector('button');b.disabled=actualStatus(active)!=='open';b.textContent=actualStatus(active)==='open'?'Subastar':labelsLive[actualStatus(active)]||'No disponible'}}
const previousLiveRender=render;
render=function(){previousLiveRender();if(route==='participate'){const title=main.querySelector('.room-header h1');if(title)title.textContent=selectedProperty.title}if(route==='detail'){const layout=main.querySelector('.detail-layout');if(layout)layout.dataset.liveId=selectedProperty.id;const price=main.querySelector('.detail-summary .detail-prices>div:last-child strong');if(price)price.dataset.live='current';const count=main.querySelector('.participants-big .count');if(count)count.dataset.live='people';main.querySelectorAll('.detail-hero .status-pill').forEach(x=>x.dataset.live='status');const side=main.querySelector('.detail-side');if(side)side.innerHTML=livePanel(selectedProperty)+`<button class="btn btn-outline" onclick="toggleFavorite(${selectedProperty.id})">${favorites.includes(selectedProperty.id)?'Quitar de guardadas':'Guardar propiedad'}</button>`}if(route==='staff'){main.querySelectorAll('.panel').forEach(p=>{if(p.textContent.includes('Inscripciones locales'))p.innerHTML='<h2>Actividad de subastas</h2><p>La participación es directa desde una cuenta de comprador. No hay inscripción por propiedad.</p>'})}patchLive()};
const previousLiveGo=go;go=function(next,payload){if(rt.pending&&next!=='participate')return toast('Consulta el resultado pendiente con el mismo reintento antes de salir.');if(next!=='participate'){rt.review=null;if(!rt.sending)rt.pending=null}previousLiveGo(next,payload);if(next==='offers')loadMine().then(()=>render())};
// Remove retired enrollment and guarantee references from the design inventory.
const retiredBases=new Set(['INS-01','GAR-01','USR-05','POST-01','POST-02','ADM-13']);
for(let i=screenInventory.length-1;i>=0;i--){const s=screenInventory[i];if(retiredBases.has(s.base)||/inscripci|garant[ií]a|postor/i.test(s.title))screenInventory.splice(i,1);else s.widgets=s.widgets.filter(w=>!JSON.stringify(w).match(/inscripci|garant[ií]a/i))}
const priorScreenLive=renderScreen;renderScreen=function(id){const s=screenInventory.find(x=>x.id===id);if(!s)return '<section class="generic"><h1>Flujo retirado</h1><p>La versión actual permite subastar directamente desde una cuenta de comprador, sin inscripción por propiedad.</p><button class="btn btn-primary" onclick="go(\'catalog\')">Explorar subastas</button></section>';if(s.base==='PUB-06'||s.base==='OFR-01')return renderParticipate(selectedProperty);if(s.base==='OFR-02')return `<section class="generic"><h1>${rt.receipt?'Registro aceptado':'Aún no hay un acuse confirmado'}</h1><p>El acuse se presenta dentro de la sala para seguir subastando hasta el cierre.</p><button class="btn btn-primary" onclick="startParticipate(${selectedProperty.id})">Volver a la subasta</button></section>`;return priorScreenLive(id)};
footer=function(){return '<footer class="footer-note">SeSubasta.cl · Prototipo con imágenes y propiedades ilustrativas.<br>'+connectionLabel()+'. Sin pagos ni efectos reales.</footer>'};
async function bootLive(){acceptSnapshots({auctions:offlineEngine.snapshots(),serverNow:Date.now()});rt.ready=true;render();if(location.protocol==='http:'||location.protocol==='https:'){try{const health=await api('/api/health');if(health.mode!=='local-demo')return;rt.mode='server';await refreshSnapshots();await loadMine();render();rt.source=new EventSource('/api/events');rt.source.addEventListener('snapshot',e=>{try{acceptSnapshots(JSON.parse(e.data))}catch{}});rt.source.onerror=()=>{rt.connected=false;patchLive()};if(rt.pending){selectedProperty=properties.find(x=>x.id===rt.pending.id)||selectedProperty;previousLiveGo('participate',selectedProperty)}}catch{rt.mode='individual';rt.connected=true;patchLive()}}}
setInterval(patchLive,500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSnapshots()});bootLive();
</script>
