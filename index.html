actions['lead-open']=el=>{const l=leadRows[Number(el.dataset.index)];const rows=Object.entries(l.data||{}).filter(([,v])=>v!=null&&v!=='');openDialog({title:`${LEAD_TYPE[l.type]} · ${l.code}`,wide:true,body:h`<dl class="review-list"><div><dt>Contacto</dt><dd>${l.name} · ${l.email||'—'} · ${l.phone||'—'} · prefiere ${l.preferred||'correo'}</dd></div><div><dt>Recibida</dt><dd>${fmt.dateTime(l.at)} · origen ${l.source||'—'}${l.campaign?' · campaña '+l.campaign:''}</dd></div>${rows.map(([k,v])=>h`<div><dt>${k}</dt><dd>${v}</dd></div>`)}${l.message?h`<div><dt>Mensaje</dt><dd>${l.message}</dd></div>`:''}<div><dt>Consentimiento</dt><dd>${l.consent?.contact?'Autoriza contacto':'—'}${l.consent?.marketing?' · acepta novedades':''}</dd></div></dl>
 ${l.type==='deletion'?h`<p class="notice">Para ejecutar la eliminación, anonimiza la cuenta desde <a href="${href('/gestion/usuarios?q='+encodeURIComponent(l.email))}" data-close>Usuarios y roles</a> (Administrador general).</p>`:''}
 <form data-form="lead-update" data-id="${l.id}" class="upload-box" novalidate><div class="field-grid"><label class="form-field"><span>Responsable</span><select name="assignedTo"><option value="">Sin asignar</option>${leadStaff.map(s=>h`<option value="${s.id}" ${l.assignedTo===s.id?'selected':''}>${s.name}</option>`)}</select></label><label class="form-field"><span>Estado</span><select name="status">${Object.entries(LEAD_STATUS).map(([k,v])=>h`<option value="${k}" ${l.status===k?'selected':''}>${v}</option>`)}</select></label></div><label class="form-field"><span>Nota interna</span><textarea name="note" rows="2"></textarea></label><label class="form-field"><span>Responder por correo (visible para la persona)</span><textarea name="reply" rows="2"></textarea></label><div class="button-row"><button class="btn btn-dark">Guardar gestión</button><button type="button" class="btn btn-outline" data-action="task-new" data-close data-title="Gestionar solicitud ${l.code}" data-link-path="/gestion/solicitudes" data-link-label="Solicitud ${l.code} · ${l.name}">${icon('check')} Asignar tarea</button>${l.phone?h`<a class="btn btn-wa" href="https://wa.me/${l.phone.replace(/\D/g,'').replace(/^9/,'569')}" target="_blank" rel="noopener">${icon('phone')} WhatsApp al contacto</a>`:''}</div></form>
 ${l.notes.length?h`<h3>Seguimiento</h3><ol class="timeline">${l.notes.map(n=>h`<li>${n.text}<br><small>${n.byName} · ${fmt.dateTime(n.at)}</small></li>`)}</ol>`:''}`})};
forms['lead-update']=form=>submitWith(form,async d=>{await PATCH('/api/v1/admin/leads/'+form.dataset.id,d);form.closest('dialog').close();toast('Gestión guardada.','success');render({keepScroll:true})});

/* ---------- ADM-07 usuarios y permisos ---------- */
let userRows=[],roleOptions=[];
staffRoute('/gestion/usuarios',{title:'Usuarios',roles:['general_admin'],view:async({path,query})=>{const r=await GET('/api/v1/admin/users?'+new URLSearchParams(Object.entries(query).filter(([,v])=>v)));userRows=r.items;roleOptions=r.roles;
 return {title:'Usuarios y permisos',html:staffShell(path,'Usuarios y permisos',h`<form class="toolbar" data-form="user-filter" data-nodraft><label class="form-field"><span>Buscar</span><input name="q" value="${query.q||''}" placeholder="Correo, nombre o ID"></label><label class="form-field"><span>Tipo</span><select name="type"><option value="">Todas</option><option value="internal" ${query.type==='internal'?'selected':''}>Equipo</option><option value="public" ${query.type==='public'?'selected':''}>Compradores</option></select></label><button class="btn btn-dark">Buscar</button></form>
  <div class="table-wrap"><table class="responsive-table"><thead><tr><th>Cuenta</th><th>Contacto</th><th>Tipo</th><th>Estado</th><th>Roles</th><th><span class="visually-hidden">Acciones</span></th></tr></thead><tbody>${r.items.map((u,i)=>h`<tr><td data-label="Cuenta"><strong>${u.name}</strong><br><small>${u.position||''}${u.area?' · '+u.area:''}</small></td><td data-label="Contacto"><small>${u.email}${u.whatsapp?h`<br>WhatsApp ${u.whatsapp}`:u.accountType==='internal'?h`<br><span class="warn">Sin WhatsApp</span>`:''}</small></td><td data-label="Tipo">${u.accountType==='internal'?'Equipo':'Comprador'}${u.mfa?h`<br><small>MFA activo</small>`:''}</td><td data-label="Estado">${tag({active:'Activa',pending:'Pendiente',blocked:'Bloqueada',deleted:'Eliminada'}[u.status],u.status==='active'?'ok':u.status==='blocked'?'bad':'')}${u.accountType==='public'?h`<br><small>${u.emailVerified?'Correo verificado':'Sin verificar'}</small>`:''}${u.deletionRequestedAt?h`<br><small class="warn">Pidió eliminación</small>`:''}</td><td data-label="Roles">${u.roleLabels.join(', ')}</td><td data-label="Acciones"><button class="btn btn-outline btn-sm" data-action="user-open" data-index="${i}" ${u.id===state.staff.id?'disabled':''}>Gestionar</button></td></tr>`)}</tbody></table></div>
  <form data-form="staff-create" class="panel" novalidate><h2>Crear usuario del equipo</h2><p>La persona recibe por correo y WhatsApp un enlace para activar su cuenta y crear su contraseña. El registro público nunca asigna roles internos.</p>
   <div class="field-grid"><label class="form-field"><span>Nombre y apellido *</span><input name="name" required autocomplete="off"></label><label class="form-field"><span>Correo *</span><input name="email" type="email" required autocomplete="off"></label></div>
   <div class="field-grid"><label class="form-field"><span>WhatsApp *</span><input name="whatsapp" type="tel" inputmode="tel" placeholder="+56 9 1234 5678" required></label><label class="form-field"><span>Cargo *</span><input name="position" required placeholder="Ej.: Ejecutiva comercial"></label></div>
   <div class="field-grid"><label class="form-field"><span>Área</span><select name="area"><option value="">Selecciona</option>${AREAS.map(a=>h`<option>${a}</option>`)}</select></label><label class="form-field"><span>Notas internas</span><input name="staffNotes" placeholder="Opcional: zona, horario, reemplazos"></label></div>
   <fieldset class="form-field" data-field="roles"><legend>Rol en la plataforma * <small>(puede tener más de uno)</small></legend><div class="check-grid">${ROLE_OPTIONS.map(([k,l])=>h`<label class="form-check"><input type="checkbox" name="role_${k}"> <span><strong>${l}</strong><br><small>${{general_admin:'Todo: aprueba y publica, usuarios y configuración. Usa código de verificación.',legal:'Antecedentes y documentos legales privados.',internal_contributor:'Crea fichas, sube fotos y solicita revisión.',operator:'Monitor de subastas, suspensión, actividad, solicitudes y adjudicación.',content_editor:'Blog: escribe, programa y publica.'}[k]}</small></span></label>`)}</div></fieldset>
   <button class="btn btn-primary">Crear usuario y enviar invitación</button></form>`,{lead:'Cada cambio de rol o estado exige motivo y queda en la auditoría.'})}}});
forms['user-filter']=form=>navigate('/gestion/usuarios?'+new URLSearchParams(Object.entries(formData(form)).filter(([,v])=>v)));
forms['staff-create']=form=>submitWith(form,async d=>{const roles=Object.keys(d).filter(k=>k.startsWith('role_')&&d[k]).map(k=>k.slice(5));const r=await POST('/api/v1/admin/users',{name:d.name,email:d.email,whatsapp:d.whatsapp,position:d.position,area:d.area,staffNotes:d.staffNotes,roles});form.reset();clearDraft('staff-create');teamCache=null;inviteResult(r,'Usuario creado');render({keepScroll:true})});
function inviteResult(r,title){openDialog({title,body:h`<p><strong>${r.user?.name||''}</strong> ${r.user?h`· ${r.user.email}`:''}</p><p>Enviamos la invitación por correo${r.user?.whatsapp||r.whatsappLink?' y WhatsApp':''}. El enlace vence en 72 horas.</p><label class="form-field"><span>Enlace de activación</span><input value="${r.activationLink}" readonly data-nodraft onclick="this.select()"></label><div class="button-row"><button class="btn btn-outline btn-sm" data-action="copy" data-value="${r.activationLink}">Copiar enlace</button>${r.whatsappLink?h`<a class="btn btn-wa btn-sm" href="${r.whatsappLink}" target="_blank" rel="noopener">${icon('phone')} Enviar por WhatsApp</a>`:''}</div>`})}
actions.copy=async el=>{try{await navigator.clipboard.writeText(el.dataset.value);toast('Copiado.','success')}catch{toast('No se pudo copiar; selecciona el texto.','error')}};
actions['user-open']=el=>{const u=userRows[Number(el.dataset.index)];openDialog({title:u.name,wide:u.accountType==='internal',body:h`<p>${u.email} · ${u.accountType==='internal'?'Cuenta del equipo':'Comprador'}${u.status==='pending'?' · invitación pendiente':''}${u.lastLoginAt?' · último ingreso '+fmt.rel(u.lastLoginAt):''}</p>
 ${u.accountType==='internal'?h`<form data-form="staff-edit" data-id="${u.id}" class="upload-box" novalidate><h3>Datos del integrante</h3><div class="field-grid"><label class="form-field"><span>Nombre</span><input name="name" value="${u.name}" required></label><label class="form-field"><span>WhatsApp</span><input name="whatsapp" type="tel" value="${u.whatsapp}" required></label></div><div class="field-grid"><label class="form-field"><span>Cargo</span><input name="position" value="${u.position}"></label><label class="form-field"><span>Área</span><select name="area"><option value="">—</option>${AREAS.map(a=>h`<option ${u.area===a?'selected':''}>${a}</option>`)}</select></label></div><label class="form-field"><span>Notas internas</span><input name="staffNotes" value="${u.staffNotes||''}"></label><div class="button-row"><button class="btn btn-dark">Guardar datos</button>${u.status==='pending'?h`<button type="button" class="btn btn-outline" data-action="resend-invite" data-id="${u.id}">Reenviar invitación</button>`:''}${u.whatsapp?h`<button type="button" class="btn btn-outline" data-action="task-new" data-close data-title="">Asignar tarea</button>`:''}</div></form><h3>Estado y roles</h3>`:''}<form data-form="user-action" data-id="${u.id}" class="stack" novalidate><label class="form-field"><span>Acción</span><select name="action">${u.status==='blocked'?h`<option value="unblock">Desbloquear</option>`:h`<option value="block">Bloquear y cerrar sesiones</option>`}${u.accountType==='internal'?h`<option value="grant">Asignar rol</option><option value="revoke">Revocar rol</option>`:''}${u.accountType==='public'&&u.status!=='deleted'?h`<option value="anonymize">Anonimizar (ejecutar eliminación de datos)</option>`:''}</select></label>${u.accountType==='internal'?h`<label class="form-field"><span>Rol</span><select name="role">${roleOptions.map(r=>h`<option value="${r.key}">${r.label}${u.roles.includes(r.key)?' (actual)':''}</option>`)}</select></label>`:''}<label class="form-field"><span>Motivo</span><textarea name="reason" rows="2" required></textarea></label><button class="btn btn-dark">Aplicar cambio</button></form>`})};
forms['staff-edit']=form=>submitWith(form,async d=>{await PATCH(`/api/v1/admin/users/${form.dataset.id}/profile`,d);form.closest('dialog')?.close();teamCache=null;toast('Datos actualizados.','success');render({keepScroll:true})});
actions['resend-invite']=async el=>{try{const r=await POST(`/api/v1/admin/users/${el.dataset.id}/resend-invite`);el.closest('dialog')?.close();inviteResult(r,'Invitación reenviada')}catch(e){toast(e.message,'error')}};
forms['user-action']=form=>submitWith(form,async d=>{if(d.action==='anonymize'){const c=await confirmDialog({title:'Anonimizar cuenta',text:'Se reemplazarán nombre, correo y teléfono, se cerrarán sus sesiones y se quitarán sus guardadas. Las ofertas históricas se conservan sin datos personales.',confirm:'Anonimizar',danger:true});if(!c.ok)return}await PATCH('/api/v1/admin/users/'+form.dataset.id,d);form.closest('dialog')?.close();toast('Cambio aplicado y auditado.','success');render({keepScroll:true})});

/* ---------- ADM-08 configuración (incluye Google Analytics 4) ---------- */
staffRoute('/gestion/configuracion',{title:'Configuración',roles:['general_admin'],view:async({path})=>{const {config:c,properties}=await GET('/api/v1/admin/config');const reasonField=h`<label class="form-field"><span>Motivo del cambio *</span><input name="reason" required minlength="5" placeholder="Queda registrado en el historial"></label>`;
 return {title:'Configuración',html:staffShell(path,'Configuración',h`
  <form data-form="config" data-section="ga" class="panel" novalidate><h2>Google Analytics 4</h2><p>Pega el ID de medición del flujo web de GA4 (Administrar › Flujos de datos › Web). Las etiquetas solo se cargan si la persona acepta cookies de analítica. Nunca se envían ofertas ni datos de contacto.</p><div class="field-grid"><label class="form-field"><span>ID de medición</span><input name="gaMeasurementId" value="${c.gaMeasurementId}" placeholder="G-XXXXXXXXXX" pattern="G-[A-Z0-9]{6,12}"></label><label class="form-check"><input type="checkbox" name="gaDebug" ${c.gaDebug?'checked':''}> <span>Modo depuración (DebugView y consola)</span></label></div>${reasonField}<button class="btn btn-dark">Guardar analítica</button><p class="hint">Eventos configurados: page_view, view_home, search_submitted, filters_applied, property_viewed, property_saved, share, registration_started, sign_up, registration_completed, login, offer_started, offer_submitted, seller_form_started, seller_form_submitted, generate_lead, blog_article_viewed, document_downloaded, currency_changed. Detalle en docs/plan-de-medicion.md.</p></form>
  <div class="panel" id="correoPanel"><h2>Correo</h2><p class="hint">Cargando el estado del proveedor…</p></div>
  <form data-form="config" data-section="uf" class="panel" novalidate><h2>Valor UF y conversión</h2><div class="field-grid"><label class="form-field"><span>Valor CLP por UF</span><input name="ufValue" type="number" step="0.01" value="${c.ufValue}"></label><label class="form-field"><span>Fecha de vigencia</span><input name="ufDate" type="date" value="${c.ufDate}"></label></div><label class="form-field"><span>Fuente</span><input name="ufSource" value="${c.ufSource}"></label><label class="form-check"><input type="checkbox" name="ufIsDemo" ${c.ufIsDemo?'checked':''}> <span>Es un valor ficticio de demostración (se rotula como tal)</span></label><p class="hint">Si la fecha no es la de hoy y no es un valor de demostración, el sitio muestra “equivalencia no disponible” y mantiene los valores en UF.</p>${reasonField}<button class="btn btn-dark">Guardar UF</button></form>
  <form data-form="config" data-section="home" class="panel" novalidate><h2>Inicio y destacados</h2><label class="form-field"><span>Titular</span><input name="homeTitle" value="${c.homeTitle}" maxlength="90"><small class="hint">Sin punto final. Usa | para pasar la segunda idea a una línea en Light y *palabra* para destacar una sola palabra clave.</small></label><label class="form-field"><span>Bajada</span><textarea name="homeLead" rows="2" maxlength="240">${c.homeLead}</textarea></label><fieldset class="form-field"><legend>Remates destacados (máximo 6, en este orden)</legend><div class="check-grid">${properties.map(p=>h`<label class="form-check"><input type="checkbox" name="feat_${p.id}" ${c.featured.includes(p.id)?'checked':''}> <span>${p.title}</span></label>`)}</div></fieldset>${reasonField}<button class="btn btn-dark">Guardar inicio</button></form>
  <form data-form="config" data-section="contact" class="panel" novalidate><h2>Datos de contacto públicos</h2><div class="field-grid"><label class="form-field"><span>Correo</span><input name="cEmail" value="${c.contact.email}"></label><label class="form-field"><span>Teléfono</span><input name="cPhone" value="${c.contact.phone}"></label><label class="form-field"><span>Instagram</span><input name="cInstagram" value="${c.contact.instagram}"></label><label class="form-field"><span>Horario</span><input name="cHours" value="${c.contact.hours}"></label></div><h3>Redes sociales del pie de página</h3><p class="hint">Deja vacío un campo para ocultar su ícono.</p><div class="field-grid">${[['instagram','Instagram'],['facebook','Facebook']].map(([k,l])=>h`<label class="form-field"><span>${l}</span><input name="s_${k}" type="url" value="${(c.social||{})[k]||''}" placeholder="https://"></label>`)}</div>${reasonField}<button class="btn btn-dark">Guardar contacto y redes</button></form>
  <form data-form="config" data-section="how" class="panel" novalidate><h2>Cómo funciona</h2><label class="form-field"><span>Título</span><input name="hTitle" value="${c.how.title}"></label><label class="form-field"><span>Bajada</span><input name="hLead" value="${c.how.lead}"></label><label class="form-field"><span>Propósito</span><textarea name="hPurpose" rows="2">${c.how.purpose}</textarea></label><label class="form-field"><span>Pasos (uno por línea: Título | Descripción)</span><textarea name="hSteps" rows="5">${c.how.steps.map(s=>s.join(' | ')).join('\n')}</textarea></label><label class="form-field"><span>Valores aprobados (uno por línea)</span><textarea name="hValues" rows="4">${c.how.values.join('\n')}</textarea></label>${reasonField}<button class="btn btn-dark">Guardar contenido</button></form>
  <form data-form="config" data-section="guarantee" class="panel" novalidate><h2>Cuenta para garantías</h2><p>Cuenta bancaria de la empresa donde las personas transfieren la garantía de seriedad. Se muestra solo a compradores con sesión iniciada que constituyen una garantía. Usa una cuenta exclusiva para garantías, separada de la operación.</p>${(()=>{const k=c.guaranteeBank||{};return h`<div class="field-grid"><label class="form-field"><span>Titular</span><input name="gHolder" value="${k.holder||''}"></label><label class="form-field"><span>RUT</span><input name="gRut" value="${k.rut||''}" placeholder="76.123.456-7"></label></div><div class="field-grid"><label class="form-field"><span>Banco</span><input name="gBank" value="${k.bank||''}"></label><label class="form-field"><span>Tipo de cuenta</span><input name="gType" value="${k.accountType||''}" placeholder="Cuenta corriente"></label></div><div class="field-grid"><label class="form-field"><span>Número de cuenta</span><input name="gNumber" value="${k.number||''}" inputmode="numeric"></label><label class="form-field"><span>Correo para comprobantes</span><input name="gEmail" type="email" value="${k.email||''}"></label></div><label class="form-field"><span>Plazo de devolución (días hábiles)</span><input name="gDays" type="number" min="1" max="30" value="${k.refundDays||3}"></label>`})()}${reasonField}<button class="btn btn-dark">Guardar cuenta de garantías</button></form>
  <form data-form="config" data-section="faqs" class="panel" novalidate><h2>Preguntas frecuentes</h2><label class="form-field"><span>Una por línea: Pregunta | Respuesta</span><textarea name="faqs" rows="8">${c.faqs.map(f=>f.q+' | '+f.a).join('\n')}</textarea></label>${reasonField}<button class="btn btn-dark">Guardar preguntas</button></form>
  <form data-form="config" data-section="legal" class="panel" novalidate><h2>Textos legales versionados</h2><label class="form-field"><span>Documento</span><select name="legalKey">${Object.entries(c.legal).map(([k,v])=>h`<option value="${k}">${v.title} (versión ${v.version})</option>`)}</select></label><label class="form-field"><span>Nueva versión</span><input name="legalVersion" placeholder="Ej.: 2026-11"></label><label class="form-field"><span>Texto (admite ## títulos y listas con -)</span><textarea name="legalBody" rows="8" data-legal-bodies="${JSON.stringify(Object.fromEntries(Object.entries(c.legal).map(([k,v])=>[k,v.body])))}">${c.legal.privacidad.body}</textarea></label><p class="hint">Si cambias los términos, define la nueva versión de bases: las cuentas deberán aceptarla antes de su próxima oferta en subastas nuevas.</p>${reasonField}<button class="btn btn-dark">Publicar nueva versión</button></form>
  <div class="panel"><h2>Historial de cambios</h2>${c.history.length?h`<ol class="timeline">${c.history.map(x=>h`<li>${fmt.dateTime(x.at)} · ${x.keys.join(', ')}<br><small>${x.reason}</small></li>`)}</ol>`:h`<p>Sin cambios registrados.</p>`}</div>`,{lead:'Los secretos técnicos no se administran aquí: se configuran en el entorno seguro del servidor.'}),
 after:root=>{loadMailPanel(c);const f=$('form[data-section="legal"]',root);const bodies=JSON.parse(f.legalBody.dataset.legalBodies);f.legalKey.addEventListener('change',()=>{f.legalBody.value=bodies[f.legalKey.value]})}}}});
async function loadMailPanel(c){const box=$('#correoPanel');if(!box)return;let st;try{st=await GET('/api/v1/admin/mail/status')}catch(e){box.innerHTML=toHtml(h`<h2>Correo</h2><p class="notice warn">${e.message}</p>`);return}

/* ===== Garantía de seriedad por remate (GAR-01 a GAR-03) =====
   Sin billetera: la persona transfiere a la cuenta de SeSubasta con un código, el equipo la confirma contra la cartola
   y al cierre se abona al precio, se devuelve a la cuenta del mismo titular o se retiene según las bases. */
const GAR_CLS={pending:'warn',reported:'warn',confirmed:'ok',rejected:'warn',held:'',applied:'ok',refund_pending:'warn',refunded:'muted',retained:'warn',cancelled:'muted'};
const garTag=g=>h`<span class="tag ${GAR_CLS[g.status]||''}">${g.statusLabel}</span>`;
const bankRows=k=>h`<dl class="review-list"><div><dt>Banco</dt><dd>${k.bank||'Te lo enviaremos por correo'}</dd></div><div><dt>Tipo y número de cuenta</dt><dd>${k.number?`${k.accountType||''} ${k.number}`.trim():'—'}</dd></div><div><dt>Titular</dt><dd>${k.holder||'—'}</dd></div><div><dt>RUT</dt><dd>${k.rut||'—'}</dd></div>${k.email?h`<div><dt>Correo de aviso</dt><dd>${k.email}</dd></div>`:''}</dl>`;

/* Bloque dentro de la sala: reemplaza el formulario de oferta mientras la garantía no esté confirmada. */
function guaranteeGate(p,info){const g=info.guarantee;const page=href(`/remates/${p.slug}/garantia`);
 if(!g)return h`<div class="bid-gate"><p class="notice">${icon('shield')} <span>Esta subasta exige una <strong>garantía de seriedad de ${fmt.clp(info.amountCLP)}</strong>. Se transfiere una vez, el equipo la confirma y luego puedes ofertar las veces que quieras.</span></p><a class="btn btn-primary btn-block" href="${page}">Constituir garantía</a><p class="hint">Si no quedas entre los dos primeros, te la devolvemos a la misma cuenta desde la que transferiste.</p></div>`;
 if(g.status==='reported')return h`<div class="bid-gate"><p class="notice">${icon('clock')} <span>Estamos verificando tu transferencia (código <strong>${g.code}</strong>). Te avisaremos por correo cuando quede confirmada.</span></p><a class="btn btn-outline btn-block" href="${page}">Ver mi garantía</a></div>`;
 return h`<div class="bid-gate"><p class="notice warn">${icon('alert')} <span>${g.status==='rejected'?h`No encontramos tu transferencia${g.note?': '+g.note:''}.`:h`Tu garantía (código <strong>${g.code}</strong>) está ${g.statusLabel.toLowerCase()}.`}</span></p><a class="btn btn-primary btn-block" href="${page}">${['pending','rejected'].includes(g.status)?'Ver instrucciones de transferencia':'Ver mi garantía'}</a></div>`}

/* GAR-01 Constituir garantía e instrucciones de transferencia */
route('/remates/:slug/garantia',{title:'Garantía',auth:'buyer',parent:'/remates',server:true,view:async({params})=>{const {property:p}=await GET('/api/v1/properties/'+encodeURIComponent(params.slug));const info=await GET('/api/v1/me/guarantees/auction/'+p.auctionId);const g=info.guarantee;const room=`/remates/${p.slug}/ofertar`;
 const head=h`<nav class="breadcrumbs"><a href="${href('/remates')}">Remates</a><span aria-hidden="true">›</span><a href="${href('/remates/'+p.slug)}">${p.title}</a><span aria-hidden="true">›</span><span>Garantía</span></nav><h1>Garantía de seriedad</h1><p class="lead">${p.title} · ${p.publicId}</p>`;
 if(!info.required)return {title:'Garantía',html:h`<section class="generic narrow">${head}<p class="notice">${icon('check')} <span>Esta subasta no exige garantía.</span></p><a class="btn btn-primary" href="${href(room)}">Ir a la sala</a></section>`};
 if(!state.user.emailVerified)return {title:'Garantía',html:h`<section class="generic narrow">${head}<p class="notice warn">${icon('alert')} <span>Verifica tu correo antes de constituir la garantía.</span></p><button class="btn btn-dark" data-action="resend-verification">Reenviar enlace</button></section>`};
 const how=h`<ol class="steps-list"><li><strong>Registra tu cuenta de devolución.</strong> Debe estar a tu nombre: solo devolvemos a esa cuenta.</li><li><strong>Transfiere ${fmt.clp(info.amountCLP)}</strong> desde esa misma cuenta, con el código que te damos en el comentario.</li><li><strong>Avísanos</strong> que transferiste. El equipo revisa la cartola y te habilita para ofertar.</li><li><strong>Al cierre:</strong> si no quedas entre los dos primeros, la devolvemos en ${info.bank.refundDays||3} días hábiles. Si te adjudicas la propiedad, se abona al precio.</li></ol>`;
 if(!g)return {title:'Constituir garantía',html:h`<section class="generic narrow">${head}<div class="panel"><h2>Cómo funciona</h2>${how}<p class="source-note">SeSubasta no mantiene saldos ni cuentas a tu nombre: cada garantía corresponde a una sola subasta.</p></div>
  <form data-form="guarantee" class="panel" novalidate data-auction="${p.auctionId}" data-slug="${p.slug}"><h2>Cuenta para la devolución</h2><div class="field-grid"><label class="form-field"><span>Titular *</span><input name="holder" autocomplete="name" value="${state.user.name}" required></label><label class="form-field"><span>RUT del titular *</span><input name="rut" data-nodraft placeholder="12.345.678-5" required autocomplete="off"></label></div>
  <div class="field-grid"><label class="form-field"><span>Banco *</span><select name="bank" required><option value="">Selecciona</option>${info.banks.map(b=>h`<option>${b}</option>`)}</select></label><label class="form-field"><span>Tipo de cuenta *</span><select name="accountType" required><option value="">Selecciona</option>${info.accountTypes.map(b=>h`<option>${b}</option>`)}</select></label></div>
  <label class="form-field"><span>Número de cuenta *</span><input name="number" data-nodraft inputmode="numeric" autocomplete="off" required></label>
  <label class="form-check"><input type="checkbox" name="ownAccount" required> <span>La cuenta está a mi nombre y transferiré la garantía desde ella.</span></label>
  <label class="form-check"><input type="checkbox" name="acceptBases" required> <span>Acepto las condiciones de la garantía descritas en las <a href="${href('/terminos')}" target="_blank">bases</a>, incluida su retención si me adjudico la propiedad y no cumplo lo establecido.</span></label>
  <button class="btn btn-primary btn-block">Obtener instrucciones de transferencia</button></form></section>`};
 const canReport=['pending','rejected'].includes(g.status);
 return {title:'Mi garantía',html:h`<section class="generic narrow">${head}<div class="panel"><div class="split-head"><h2>Garantía ${g.code}</h2>${garTag(g)}</div>
  ${g.status==='confirmed'?h`<p class="notice success">${icon('check')} <span>Garantía confirmada. Ya puedes ofertar.</span></p><a class="btn btn-primary" href="${href(room)}">Ir a la sala</a>`:''}
  ${g.status==='rejected'?h`<p class="notice warn">${icon('alert')} <span>No encontramos tu transferencia${g.note?': '+g.note:''}. Revisa los datos y vuelve a informarla.</span></p>`:''}
  ${g.status==='reported'?h`<p class="notice">${icon('clock')} <span>Estamos verificando tu transferencia. Te avisaremos por correo.</span></p>`:''}
  ${['retained'].includes(g.status)&&g.note?h`<p class="notice warn">${icon('alert')} <span>${g.note}</span></p>`:''}
  ${canReport?h`<h3>Transfiere exactamente ${fmt.clp(g.amountCLP)}</h3>${bankRows(info.bank)}<p class="notice">${icon('alert')} <span>Escribe <strong>${g.code}</strong> en el comentario de la transferencia y hazla desde tu cuenta ${g.refundAccount.bank} ${g.refundAccount.number}. Las transferencias desde cuentas de otras personas se devuelven y no habilitan para ofertar.</span></p>
   <form data-form="guarantee-report" data-id="${g.id}" novalidate><label class="form-field"><span>N° de operación (opcional)</span><input name="operation" maxlength="60" autocomplete="off"></label><div class="button-row"><button class="btn btn-primary">Ya transferí</button>${g.status==='pending'?h`<button type="button" class="btn btn-outline" data-action="guarantee-cancel" data-id="${g.id}">Anular</button>`:''}</div></form>`:''}
  <dl class="review-list"><div><dt>Monto</dt><dd>${fmt.clp(g.amountCLP)}</dd></div><div><dt>Cuenta de devolución</dt><dd>${g.refundAccount.holder} · ${g.refundAccount.bank} · ${g.refundAccount.accountType} ${g.refundAccount.number}</dd></div><div><dt>Solicitada</dt><dd>${fmt.dateTime(g.createdAt)}</dd></div>${g.confirmedAt?h`<div><dt>Confirmada</dt><dd>${fmt.dateTime(g.confirmedAt)}</dd></div>`:''}${g.refundedAt?h`<div><dt>Devuelta</dt><dd>${fmt.dateTime(g.refundedAt)} · operación ${g.refundRef}</dd></div>`:''}</dl></div>
  <div class="panel"><h2>Cómo funciona</h2>${how}</div></section>`}}});
forms.guarantee=form=>submitWith(form,async d=>{await POST(`/api/v1/auctions/${form.dataset.auction}/guarantee`,{holder:d.holder,rut:d.rut,bank:d.bank,accountType:d.accountType,number:d.number,ownAccount:d.ownAccount,acceptBases:d.acceptBases});clearDraft('guarantee');Analytics.event('guarantee_started',{});toast('Listo. Te enviamos las instrucciones por correo.','success');render()});
forms['guarantee-report']=form=>submitWith(form,async d=>{await POST(`/api/v1/me/guarantees/${form.dataset.id}/report`,{operation:d.operation});toast('Gracias. El equipo verificará tu transferencia.','success');render()});
actions['guarantee-cancel']=async el=>{if(!confirm('¿Anular esta garantía? Podrás crear otra mientras la subasta esté abierta.'))return;try{await POST(`/api/v1/me/guarantees/${el.dataset.id}/cancel`);toast('Garantía anulada.');render()}catch(e){toast(e.message,'error')}};

/* GAR-02 Mis garantías */
route('/mi-cuenta/garantias',{title:'Garantías',auth:'buyer',parent:'/mi-cuenta',view:async({path})=>{const {items}=await GET('/api/v1/me/guarantees');
 return {title:'Mis garantías',html:accountShell(path,'Mis garantías',items.length?h`<div class="table-wrap"><table class="responsive-table"><caption class="visually-hidden">Tus garantías</caption><thead><tr><th scope="col">Propiedad</th><th scope="col">Código</th><th scope="col">Monto</th><th scope="col">Estado</th><th scope="col">Devolución a</th><th scope="col"><span class="visually-hidden">Acción</span></th></tr></thead><tbody>${items.map(g=>h`<tr><td data-label="Propiedad">${g.property?.title||'—'}</td><td data-label="Código">${g.code}</td><td data-label="Monto">${fmt.clp(g.amountCLP)}</td><td data-label="Estado">${garTag(g)}</td><td data-label="Devolución a">${g.refundAccount.bank} ${g.refundAccount.number}</td><td data-label="Acción">${g.property?h`<a class="text-link" href="${href('/remates/'+g.property.slug+'/garantia')}">Ver</a>`:''}</td></tr>`)}</tbody></table></div>`:h`<div class="empty-state"><span class="system-icon">${icon('shield')}</span><p>No tienes garantías. Algunas subastas la exigen antes de ofertar; lo verás en la sala.</p><a class="btn btn-dark" href="${href('/remates')}">Explorar remates</a></div>`,'Cada garantía corresponde a una subasta. SeSubasta no mantiene saldos a tu nombre.')}}});

/* GAR-03 Gestión de garantías (Operador de remates y Administrador general) */
STAFF_NAV.splice(STAFF_NAV.findIndex(n=>n.path==='/gestion/ofertas')+1,0,{path:'/gestion/garantias',label:'Garantías',icon:'shield',roles:['operator']});
let garRows=[],garBank={};
staffRoute('/gestion/garantias',{title:'Garantías',roles:['operator'],view:async({path,query})=>{const qs=new URLSearchParams(Object.entries(query).filter(([,v])=>v));const r=await GET('/api/v1/admin/guarantees?'+qs);garRows=r.items;garBank=r.bank;const f=query.status||'';
 const chips=[['','Todas'],['reported','Por verificar'],['refund_pending','Por devolver'],['confirmed','Confirmadas'],['held','Retenidas al cierre'],['pending','Esperando transferencia'],['rejected','No encontradas'],['refunded','Devueltas'],['applied','Abonadas'],['retained','Retenidas por incumplimiento']];
 return {title:'Garantías',html:staffShell(path,'Garantías',h`${!garBank.number?h`<p class="notice warn">${icon('alert')} <span>Falta la cuenta de destino de las garantías. ${hasRole('general_admin')?h`Complétala en <a href="${href('/gestion/configuracion')}">Configuración</a>.`:'Pide al Administrador general que la complete en Configuración.'}</span></p>`:''}
  <div class="filters">${chips.map(([k,l])=>h`<a class="chip ${f===k?'active':''}" href="${href('/gestion/garantias'+(k?'?status='+k:''))}" data-replace>${l}${k&&r.counts[k]?` (${r.counts[k]})`:''}</a>`)}</div>
  <form class="search-inline" data-form="gar-search" role="search"><input name="q" value="${query.q||''}" placeholder="Código, nombre, correo, RUT o propiedad" aria-label="Buscar garantías"><button class="btn btn-outline btn-sm">Buscar</button></form>
  ${garRows.length?h`<div class="table-wrap"><table class="responsive-table"><thead><tr><th>Código</th><th>Persona</th><th>Propiedad</th><th>Monto</th><th>Estado</th><th>Actualizada</th><th><span class="visually-hidden">Acción</span></th></tr></thead><tbody>${garRows.map((g,i)=>h`<tr><td data-label="Código">${g.code}</td><td data-label="Persona">${g.user?.name||'—'}<br><small>${g.refundAccount.rut}</small></td><td data-label="Propiedad">${g.property?.title||g.auctionId}</td><td data-label="Monto">${fmt.clp(g.amountCLP)}</td><td data-label="Estado">${garTag(g)}</td><td data-label="Actualizada">${fmt.short(g.history.at(-1)?.at)}</td><td data-label="Acción"><button class="btn btn-outline btn-sm" data-action="gar-open" data-index="${i}">Gestionar</button></td></tr>`)}</tbody></table></div>`:h`<div class="empty-state"><p>No hay garantías con este filtro.</p></div>`}
  <p class="source-note">Confirma cada ingreso contra la cartola: monto exacto, código en el comentario y titular igual al de la cuenta de devolución. La devolución la registra una persona distinta de quien confirmó el ingreso. Retener una garantía es decisión del Administrador general.</p>`,{lead:'Ingresos por verificar, devoluciones pendientes e historial de cada garantía.'})}}});
forms['gar-search']=form=>{const q=form.q.value.trim();navigate('/gestion/garantias'+(q?'?q='+encodeURIComponent(q):''),{replace:true})};
const GAR_FORMS={
 confirm:['Confirmar ingreso','Confirma que el ingreso aparece en la cartola.',true,h`<label class="form-field"><span>Referencia de la cartola *</span><input name="reference" required minlength="4" placeholder="N° de operación o fecha y glosa"></label><label class="form-check"><input type="checkbox" name="matches" required> <span>El monto es exacto, el comentario trae el código y el titular coincide con la cuenta de devolución.</span></label>`],
 reject:['Transferencia no encontrada','La persona recibe el motivo y puede volver a informarla.',false,h`<label class="form-field"><span>Motivo (lo verá la persona) *</span><input name="reason" required minlength="5" placeholder="Ej.: el monto no coincide"></label>`],
 refund:['Registrar devolución','Primero transfiere desde el banco a la cuenta de devolución indicada arriba.',true,h`<label class="form-field"><span>N° de operación de la devolución *</span><input name="reference" required minlength="4"></label>`],
 release:['Liberar para devolución','Pasa la garantía a "Devolución en curso".',false,h`<label class="form-field"><span>Motivo *</span><input name="reason" required minlength="5"></label>`],
 retain:['Retener por incumplimiento','Solo según las bases. La persona recibe el motivo por correo.',false,h`<label class="form-field"><span>Motivo según las bases *</span><textarea name="reason" rows="2" required minlength="5"></textarea></label>`],
 void:['Anular','Úsalo cuando no ingresó dinero. Queda en el historial.',false,h`<label class="form-field"><span>Motivo *</span><input name="reason" required minlength="5"></label>`]};
const GAR_ALLOWED={pending:['confirm','void'],reported:['confirm','reject','void'],rejected:['confirm','void'],confirmed:['release'],held:['release','retain'],refund_pending:['refund','void']};
actions['gar-open']=el=>{const g=garRows[Number(el.dataset.index)];const acts=(GAR_ALLOWED[g.status]||[]).filter(a=>a!=='retain'||state.staff.roles.includes('general_admin'));const a=g.refundAccount;
 openDialog({title:`Garantía ${g.code}`,wide:true,body:h`<div class="split-head">${garTag(g)}<strong>${fmt.clp(g.amountCLP)}</strong></div><dl class="review-list"><div><dt>Persona</dt><dd>${g.user?.name||'—'} · ${g.user?.email||''}${g.user?.phone?' · '+g.user.phone:''}</dd></div><div><dt>Propiedad</dt><dd>${g.property?.title||''} · subasta #${g.auctionId}</dd></div><div><dt>Cuenta de devolución</dt><dd>${a.holder} · RUT ${a.rut}<br>${a.bank} · ${a.accountType} ${a.number}</dd></div>${g.operation?h`<div><dt>N° de operación informado</dt><dd>${g.operation}</dd></div>`:''}${g.confirmedByName?h`<div><dt>Ingreso confirmado por</dt><dd>${g.confirmedByName} · ${fmt.dateTime(g.confirmedAt)}</dd></div>`:''}${g.refundRef?h`<div><dt>Devolución</dt><dd>${g.refundRef} · ${fmt.dateTime(g.refundedAt)}</dd></div>`:''}</dl>
  ${acts.map(k=>{const [title,help,,fields]=GAR_FORMS[k];return h`<form data-form="gar-action" data-id="${g.id}" data-act="${k}" class="upload-box" novalidate><h3>${title}</h3><p class="hint">${help}</p>${fields}<button class="btn ${k==='retain'||k==='void'?'btn-outline':'btn-dark'}">${title}</button></form>`})}
  <h3>Historial</h3><ol class="timeline">${g.history.slice().reverse().map(x=>h`<li><strong>${GAR_LABEL(x.to)}</strong> · ${fmt.dateTime(x.at)} · ${x.byName}${x.reason?h`<br><small>${x.reason}</small>`:''}</li>`)}</ol>`})};
const GAR_LABEL=k=>({pending:'Esperando transferencia',reported:'Transferencia informada',confirmed:'Confirmada',rejected:'No encontrada',held:'Retenida hasta la adjudicación',applied:'Abonada al precio',refund_pending:'Devolución en curso',refunded:'Devuelta',retained:'Retenida por incumplimiento',cancelled:'Anulada'}[k]||k);
forms['gar-action']=form=>submitWith(form,async d=>{await POST(`/api/v1/admin/guarantees/${form.dataset.id}/${form.dataset.act}`,{reason:d.reason,reference:d.reference,matches:d.matches});form.closest('dialog').close();toast('Garantía actualizada.','success');render({keepScroll:true})});
